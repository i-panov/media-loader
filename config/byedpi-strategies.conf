# One strategy per line: <name> <ciadpi args...>
# Ports start at BYEDPI_BASE_PORT and increment in file order.
# The first line uses the base port from PROXY_URL (default 1080).
tlsrec1 --tlsrec 1+s
auto-torst --auto=torst --timeout 3 --tlsrec 3+s
disorder1 --disorder 1
fake-md5 --fake -1 --md5sig
oob3s --oob 3+s
split-disorder --split 1+s --disorder 3+s
auto-ssl-fake --auto=ssl_err --timeout 3 --fake -1 --ttl 5
