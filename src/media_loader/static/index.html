<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'">
    <title>media-loader</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>media-loader</h1>
          <p class="tagline">Скачивание медиа по ссылке</p>
        </div>
        <button id="token-toggle" class="secondary compact" type="button"
          aria-expanded="false" aria-controls="token-panel">
        Токен
      </button>
      </header>

      <section id="token-panel" class="card token-panel" hidden>
        <label for="token">API-токен</label>
        <div class="inline">
          <input id="token" type="password" autocomplete="off"
            spellcheck="false" placeholder="mlk_...">
          <button id="token-save" class="secondary"
            type="button">Сохранить</button>
        </div>
        <p
          class="hint">Токен хранится только в этом браузере и не попадает в URL.</p>
        <button id="token-clear" class="link-button"
          type="button">Забыть токен</button>
      </section>

      <form id="download-form" class="card" novalidate>
        <label for="url">Ссылка на видео или аудио</label>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off"
          placeholder="https://..." required>

        <details id="options" class="options">
          <summary>Параметры</summary>
          <div class="grid">
            <fieldset class="field radio-field">
              <legend>Тип</legend>
              <label
                class="radio"><input id="mode-video" type="radio" name="media_type" value="video" checked> Видео</label>
              <label
                class="radio"><input id="mode-audio" type="radio" name="media_type" value="audio"> Только аудио</label>
            </fieldset>

            <label id="video-format-field" class="field" for="video-format">
            Видеоформат
            <select id="video-format">
              <option value="mp4">MP4</option>
              <option value="mkv">MKV</option>
            </select>
          </label>

            <label id="audio-format-field" class="field" for="audio-format"
              hidden>
            Аудиоформат
            <select id="audio-format">
              <option value="mp3">MP3</option>
              <option value="m4a">M4A</option>
              <option value="opus">Opus</option>
              <option value="original">Original</option>
            </select>
          </label>

            <label id="quality-field" class="field" for="quality">
            Качество
            <select id="quality">
              <option value="">Максимум</option>
            </select>
          </label>
          </div>
        </details>

        <button id="start-button" class="primary"
          type="submit">Загрузить</button>
        <p id="form-error" class="error" role="alert" hidden></p>
      </form>

      <section id="status-card" class="card status-card" hidden
        aria-live="polite">
        <div class="status-head">
          <div>
            <p id="status-label" class="eyebrow">В очереди</p>
            <h2 id="media-title">Загрузка</h2>
          </div>
          <span id="status-badge" class="badge">queued</span>
        </div>

        <p id="media-meta" class="meta" hidden></p>

        <progress id="progress" max="100"></progress>
        <div class="progress-meta">
          <span id="progress-text">Ожидание</span>
          <span id="started-at"></span>
        </div>

        <p id="status-detail" class="hint"></p>

        <div class="actions">
          <a id="download-link" class="primary button-link" hidden
            download>Скачать файл</a>
          <button id="reset-button" class="secondary"
            type="button">Новая ссылка</button>
        </div>
      </section>

      <footer class="footer">
        <span>media-loader</span>
        <span>Кэш, yt-dlp, ffmpeg, byedpi</span>
      </footer>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
